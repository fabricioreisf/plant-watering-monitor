# Configuração do broker Mosquitto.
#
# Fase 1 (esqueleto): o broker sobe, mas recusa todas as conexões — acesso anônimo
# está desligado e ainda não há usuários cadastrados.
# Fase 4 (IoT): adiciona TLS (listener 8883), password_file com um usuário por
# dispositivo e ACL restringindo cada um ao próprio tópico devices/{device_id}/telemetry.

listener 1883
allow_anonymous false

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
