[project]
name = "plant-monitor-backend"
version = "0.1.0"
description = "Backend do Monitor de Plantas: API, balanço hídrico e ingestão de sensores."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.5",  # hook pytest_asyncio_loop_factories (ver tests/conftest.py)
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.db.seeds" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Um único event loop: o engine do banco de teste é compartilhado pela sessão inteira.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "W",
    "F",     # pyflakes
    "I",     # isort
    "B",     # bugbear
    "UP",    # pyupgrade
    "SIM",   # simplify
    "ASYNC", # armadilhas de async
    "RUF",
]

[tool.ruff.lint.flake8-bugbear]
# Padrão do FastAPI: dependências declaradas como valor default.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]
